# CI — cổng chặn code hỏng TRƯỚC khi vào main.
#
# Phủ (an toàn, không cần DB): lint FILE THAY ĐỔI + build (build tự typecheck qua tsc của Next).
# KHÔNG chạy verify:*/e2e ở đây — chúng nối thẳng Supabase (dev/prod chung 1 DB) và
# e2e từng rò seed vào prod → để Roo/Claude chạy LOCAL. Xem agent/AGENT_RULES.md §6.
#
# LƯU Ý nợ lint: repo hiện có ~27 lỗi lint TỒN ĐỌNG (SSOT: native <button>/<input>,
# arbitrary Tailwind, rules-of-hooks, Date.now purity...). Vì vậy CI CHỈ lint file
# thay đổi trong PR — code MỚI phải sạch, nợ cũ dọn ở task riêng (không chặn PR khác).
#
# Để CI THỰC SỰ CHẶN merge, cần (chỉ bạn làm được, 1 lần):
#   1. GitHub → Settings → Branches → Add rule cho `main`:
#      "Require status checks to pass" → chọn "quality".
#   2. Làm việc theo PR: Codex push branch → mở PR → CI xanh → merge vào main → Vercel deploy.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # cần lịch sử để diff file thay đổi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Xác định file JS/TS thay đổi
        id: diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="HEAD~1"
          fi
          FILES=$(git diff --name-only --diff-filter=ACMR "$BASE"...HEAD | grep -E '\.(ts|tsx|js|jsx|mjs)$' || true)
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$FILES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Lint (chỉ file thay đổi)
        run: |
          FILES="${{ steps.diff.outputs.files }}"
          if [ -z "$FILES" ]; then echo "Không có file JS/TS thay đổi — bỏ qua lint."; exit 0; fi
          echo "Lint các file:"; echo "$FILES"
          npx eslint $FILES

      - name: Build
        # Env GIẢ cho compile — build không kết nối DB (mọi list page là force-dynamic,
        # không prerender data). Nếu build thật sự cần secret → thay bằng ${{ secrets.* }}.
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key-for-build-only
          NEXT_PUBLIC_SITE_URL: https://example.com
          # Sentry: không có SENTRY_AUTH_TOKEN → plugin bỏ qua upload sourcemap (không fail build).
        run: npm run build
