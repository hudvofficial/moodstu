#
# LUẬT (xem agent/AGENT_RULES.md §3):
#   - Mỗi task 1 `owner` tại một thời điểm. Chỉ owner được ghi trong `locks`.
#   - Hai task chưa `merged` KHÔNG được có `locks` giao nhau.
#   - Đổi status/owner = đồng thời viết 1 file trong HANDOFFS/.
#
# status: spec | approved | implementing | testing | review | fixing | ci | merged | blocked
# owner theo status: spec/review/ci -> claude ; implementing/fixing -> codex ; testing -> roo
#
# ---- SCHEMA 1 task ----
# - id: T-YYYYMMDD-<slug>          # định danh duy nhất
#   title: <mô tả ngắn>
#   status: spec
#   owner: claude
#   branch: codex/<slug>           # branch/worktree Codex làm
#   worktree: .worktrees/<slug>    # (nếu dùng worktree riêng)
#   locks:                         # vùng độc quyền của task — KHÔNG chồng task khác
#     - components/<module>/**
#     - app/actions/<module>-*.ts
#   spec: agent/HANDOFFS/T-YYYYMMDD-<slug>.spec.md
#   verify:                        # gate phải xanh trước merge
#     - npm run build
#     - npm run verify:<module>
#   depends_on: []                 # id task phải merged trước
#   notes: <ghi chú>

